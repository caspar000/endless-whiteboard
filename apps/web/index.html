<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!-- viewport-fit + no user-scaling: the canvas owns pinch-zoom, so browser zoom on a
		     double-tap would fight it. This is what makes touch feel native on iPad. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#101012" />
		<meta name="description" content="An endless whiteboard where every element is a typed node." />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<title>Lifeboard</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
