# The whole-life test board ("Insert the whole-life test board"): you at the centre, the five
# pillars, and simple trees on each to lay out against (docs/skill-tree-layout-plan.md). Director
# hangs on Practical and Adler on Mental from their own files. Placeholder content, to be replaced.
goal: life-test
name: Whole-life test

trees:
  - id: mastery
    name: You
    nodes:
      - { id: root, name: You, kind: mastery, icon: user }
      - { id: physical, name: Physical, kind: pillar, icon: barbell, requires: [ { node: [root] } ] }
      - { id: mental, name: Mental, kind: pillar, icon: brain, requires: [ { node: [root] } ] }
      - { id: spiritual, name: Spiritual, kind: pillar, icon: leaf, requires: [ { node: [root] } ] }
      - { id: practical, name: Practical, kind: pillar, icon: hammer, requires: [ { node: [root] } ] }
      - { id: social, name: Social, kind: pillar, icon: users, requires: [ { node: [root] } ] }

  - id: calisthenics
    name: Calisthenics
    mount: mastery/physical
    nodes:
      - { id: basics, name: Bodyweight Basics, kind: root, icon: run }
      - { id: push, name: Push Progression, icon: arrow-up, requires: [ { node: [basics] }, { count: { min: 2 } } ] }
      - { id: pull, name: Pull Progression, icon: arrow-down, requires: [ { node: [basics] }, { count: { min: 2 } } ] }
      - { id: legs, name: Leg Progression, icon: walk, requires: [ { node: [basics] }, { count: { min: 2 } } ] }
      - { id: handstand, name: Handstand Push-up, icon: hand-stop, requires: [ { node: [push] }, { count: { min: 1 } } ] }
      - { id: muscle-up, name: Muscle-up, icon: stairs-up, requires: [ { node: [push, pull] }, { count: { min: 1 } } ] }
      - { id: pistol, name: Pistol Squat, icon: stretching, requires: [ { node: [legs] }, { count: { min: 1 } } ] }

  - id: kettlebell
    name: Kettlebells
    mount: mastery/physical
    nodes:
      - { id: basics, name: Kettlebell Basics, kind: root, icon: weight }
      - { id: swing, name: The Swing, icon: rotate, requires: [ { node: [basics] }, { count: { min: 1 } } ] }
      - { id: get-up, name: Turkish Get-up, icon: arrow-bar-up, requires: [ { node: [basics] }, { count: { min: 1 } } ] }
      - { id: clean-press, name: Clean and Press, icon: barbell, requires: [ { node: [swing] }, { count: { min: 1 } } ] }
      - { id: sinister, name: Simple and Sinister, kind: keystone, icon: flame, requires: [ { node: [swing, get-up] }, { count: { min: 2 } } ] }

  - id: diet
    name: Diet
    mount: mastery/physical
    nodes:
      - { id: basics, name: Know What You Eat, kind: root, icon: salad }
      - { id: protein, name: Enough Protein, icon: egg, requires: [ { node: [basics] }, { count: { min: 1 } } ] }
      - { id: cooking, name: Cook at Home, icon: chef-hat, requires: [ { node: [basics] }, { count: { min: 2 } } ] }
      - { id: meal-prep, name: Meal Prep, icon: box, requires: [ { node: [cooking] }, { count: { min: 1 } } ] }

  - id: attention
    name: Attention
    mount: mastery/mental
    nodes:
      - { id: deep-work, name: Deep Work, kind: root, icon: focus-2 }
      - { id: single-tasking, name: Single-tasking, icon: target, requires: [ { node: [deep-work] }, { count: { min: 1 } } ] }
      - { id: memory, name: Memory Palace, icon: building-castle, requires: [ { node: [deep-work] }, { count: { min: 1 } } ] }

  - id: meditation
    name: Meditation
    mount: mastery/spiritual
    nodes:
      - { id: sit, name: Sit Daily, kind: root, icon: yoga }
      - { id: breath, name: Breath Awareness, icon: wind, requires: [ { node: [sit] }, { count: { min: 2 } } ] }
      - { id: body-scan, name: Body Scan, icon: scan, requires: [ { node: [sit] }, { count: { min: 1 } } ] }
      - { id: metta, name: Loving-kindness, icon: heart, requires: [ { node: [sit] }, { count: { min: 1 } } ] }
      - { id: concentration, name: Concentration, icon: circle-dot, requires: [ { node: [breath] }, { count: { min: 2 } } ] }
      - { id: insight, name: Noting and Insight, icon: eye, requires: [ { node: [body-scan] }, { count: { min: 2 } } ] }
      # Shared with Mental: it grows from Concentration here and from Single-tasking in Attention.
      - { id: steady-attention, name: Steady Attention, kind: keystone, icon: link, requires: [ { node: [concentration, attention/single-tasking] }, { count: { min: 1 } } ] }

  - id: tabletop
    name: Tabletop Campaigns
    mount: mastery/social
    nodes:
      - { id: play, name: Play at the Table, kind: root, icon: dice-5 }
      - { id: one-shot, name: Run a One-shot, icon: sword, requires: [ { node: [play] }, { count: { min: 1 } } ] }
      - { id: worldbuilding, name: Worldbuilding, icon: world, requires: [ { node: [play] }, { count: { min: 2 } } ] }
      - { id: improv, name: Improvising NPCs, icon: masks-theater, requires: [ { node: [play] }, { count: { min: 1 } } ] }
      - { id: campaign, name: Run a Campaign, kind: keystone, icon: map, requires: [ { node: [one-shot, worldbuilding] }, { count: { min: 1 } } ] }

